<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources | Sarah Warfield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      font-size: 16px;
      line-height: 1.7;
    }
    nav {
      background-color: #fff;
      padding: 14px 20px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav a {
      display: inline-block;
      margin: 0 12px;
      text-decoration: none;
      color: #555;
      font-size: 15px;
      font-weight: 600;
    }
    nav a:hover { color: #222; }
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background-color: #fff;
      border-radius: 8px;
      padding: 25px 30px;
      margin-bottom: 20px;
    }
    .card > h2 {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f2f2f2;
    }
    select#workshop-select {
      width: 100%;
      font-size: 16px;
      font-family: inherit;
      color: #333;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #fafafa;
      margin-bottom: 24px;
    }
    .session {
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .session:last-child { margin-bottom: 0; }
    .session > summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .session > summary::-webkit-details-marker { display: none; }
    .session > summary::after {
      content: "▾";
      color: #999;
      transition: transform 0.15s ease;
      flex-shrink: 0;
      margin-left: 10px;
    }
    .session[open] > summary::after { transform: rotate(180deg); }
    .session > summary:hover { color: #000; }
    .session-body {
      padding: 0 18px 16px;
    }
    .subgroup {
      margin-top: 12px;
    }
    .subgroup h4 {
      font-size: 13px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }
    .subgroup-details {
      margin-top: 12px;
    }
    .subgroup-details summary {
      list-style: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subgroup-details summary::-webkit-details-marker { display: none; }
    .subgroup-details summary::before {
      content: "▸";
      font-size: 11px;
      color: #aaa;
      transition: transform 0.15s ease;
    }
    .subgroup-details[open] summary::before { transform: rotate(90deg); }
    .subgroup-details summary:hover { color: #555; }
    .subgroup-details .file-list { margin-top: 4px; }
    .file-list {
      list-style: none;
      padding: 0;
      margin-left: 0;
    }
    .file-list li {
      padding: 8px 0;
      border-bottom: 1px solid #f2f2f2;
    }
    .file-list li:last-child { border-bottom: none; }
    .file-list a {
      text-decoration: none;
      color: #444;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .file-list a:hover { color: #000; }
    .file-list a::before {
      content: "↓";
      font-size: 14px;
      background: #f2f2f2;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .empty-note {
      color: #888;
      font-size: 15px;
      font-style: italic;
    }
    .blurb {
      background-color: #f9f7f2;
      border-left: 3px solid #ddd0a8;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 15px;
      color: #555;
      font-style: italic;
      white-space: pre-wrap;
      display: none;
    }
    .blurb.visible { display: block; }
    @media (max-width: 600px) {
      nav a { margin: 0 8px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="educators.html">For Educators</a>
    <a href="students.html">For Students &amp; Families</a>
    <a href="about.html">About</a>
    <a href="resources.html">Resources</a>
    <a href="updates.html">Updates</a>
  </nav>
  <div class="container">
    <div class="card">
      <h2>Workshop Files</h2>
      <p style="font-weight: 700; margin-bottom: 20px;">Feel free to download and share these resources. Select the workshop you attended to find its files. Note: downloads work best on a laptop or desktop — mobile devices may not support direct downloads.</p>

      <select id="workshop-select">
        <option value="">Loading workshops…</option>
      </select>

      <div class="blurb" id="blurb"></div>
      <div id="file-list"></div>
    </div>
  </div>

  <script>
    function humanize(filename) {
      const base = filename.split("/").pop();
      const name = base.replace(/\.[^/.]+$/, "");
      return name.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
    }

    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    fetch("workshops/manifest.json")
      .then(r => r.json())
      .then(workshops => {
        const select = document.getElementById("workshop-select");
        const fileList = document.getElementById("file-list");

        select.innerHTML = '<option value="">Choose a workshop…</option>' +
          workshops.map((w, i) => `<option value="${i}">${w.title}</option>`).join("");

        const blurb = document.getElementById("blurb");

        function render(index) {
          fileList.innerHTML = "";
          blurb.textContent = "";
          blurb.classList.remove("visible");
          if (index === "") return;
          const workshop = workshops[index];

          fetch(`workshops/${workshop.slug}/blurb.txt`)
            .then(r => r.ok ? r.text() : Promise.reject())
            .then(text => {
              if (text.trim()) {
                blurb.textContent = text.trim();
                blurb.classList.add("visible");
              }
            })
            .catch(() => {});

          if (!workshop.files.length) {
            fileList.innerHTML = '<p class="empty-note">Files for this workshop are coming soon — check back shortly.</p>';
            return;
          }

          const sessions = new Map();
          const loose = [];
          workshop.files.forEach(f => {
            const parts = f.split("/");
            if (parts.length === 1) { loose.push(f); return; }
            const sessionName = parts[0];
            if (!sessions.has(sessionName)) sessions.set(sessionName, []);
            sessions.get(sessionName).push(f);
          });

          const fileLink = f => `
            <li>
              <a href="workshops/${workshop.slug}/${encodePath(f)}" download>
                ${humanize(f)}
              </a>
            </li>
          `;

          const subgroupOrder = ["Presentation", "Handouts"];

          function subgroupLabel(parts) {
            if (parts.length === 2) return "Presentation";
            if (parts.length === 3 && parts[1].toLowerCase() === "handouts") return "Handouts";
            return parts.slice(1, -1).join(" / ");
          }

          function renderSession(files) {
            const subgroups = new Map();
            files.forEach(f => {
              const label = subgroupLabel(f.split("/"));
              if (!subgroups.has(label)) subgroups.set(label, []);
              subgroups.get(label).push(f);
            });
            subgroups.forEach(fs => fs.sort((a, b) => a.localeCompare(b)));

            const orderedLabels = [
              ...subgroupOrder.filter(l => subgroups.has(l)),
              ...Array.from(subgroups.keys()).filter(l => !subgroupOrder.includes(l))
            ];

            return orderedLabels.map(label => {
              const list = `<ul class="file-list">${subgroups.get(label).map(fileLink).join("")}</ul>`;
              if (label === "Handouts") {
                return `
                  <details class="subgroup-details">
                    <summary>${label}</summary>
                    ${list}
                  </details>
                `;
              }
              return `
                <div class="subgroup">
                  <h4>${label}</h4>
                  ${list}
                </div>
              `;
            }).join("");
          }

          const looseHtml = loose.length ? `<ul class="file-list">${loose.map(fileLink).join("")}</ul>` : "";

          const sessionsHtml = Array.from(sessions.entries()).map(([name, files]) => `
            <details class="session">
              <summary>${name}</summary>
              <div class="session-body">${renderSession(files)}</div>
            </details>
          `).join("");

          fileList.innerHTML = looseHtml + sessionsHtml;
        }

        select.addEventListener("change", e => render(e.target.value));

        if (workshops.length === 1) {
          select.value = "0";
          render("0");
        }
      })
      .catch(() => {
        document.getElementById("workshop-select").innerHTML = '<option value="">Could not load workshops</option>';
      });
  </script>
</body>
</html>
